name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: jc3248w535, target: esp32s3 }
          - { board: jc4827w543c, target: esp32s3 }
          - { board: es3c28p, target: esp32s3 }
          - { board: esp32-8048s043c, target: esp32s3 }
          - { board: esp32-8048s050c, target: esp32s3 }
          - { board: esp32-8048s070c, target: esp32s3 }
          - { board: esp32-4827s043c, target: esp32s3 }
          - { board: esp32-4848s040c, target: esp32s3 }
          - { board: esp32-2432s028r, target: esp32 }
          - { board: esp32-2432s028r-2usb, target: esp32 }
          - { board: esp32-2432s028rv3, target: esp32 }
          - { board: jc2432w328c, target: esp32 }
          - { board: esp32-2432s024c, target: esp32 }
          - { board: esp32-2432s024r, target: esp32 }
          - { board: esp32-2432s032c, target: esp32 }
          - { board: esp32-3248s035c, target: esp32 }
          - { board: esp32-3248s035r, target: esp32 }
    name: firmware (${{ matrix.board }})
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          path: firmware
          command: idf.py -B build/${{ matrix.board }} -DOPENDECK_BOARD=${{ matrix.board }} build

  # Runs the shared firmware in Espressif's QEMU on virtual boards (firmware/boards/qemu-*)
  # and checks boot, storage, the default deck, the protocol, drawing and taps.
  qemu:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    timeout-minutes: 45  # the plain ESP32 is slow under emulation (about 25 minutes)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: qemu-esp32, target: esp32 }
          - { board: qemu-esp32s3, target: esp32s3 }
    name: qemu (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        shell: bash
        run: |
          apt-get update && apt-get install -y libslirp0 libsdl2-2.0-0
          . $IDF_PATH/export.sh
          python $IDF_PATH/tools/idf_tools.py install qemu-xtensa
          pip install pillow
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py -B build/${{ matrix.board }} -DOPENDECK_BOARD=${{ matrix.board }} build
          cd build/${{ matrix.board }}
          python -m esptool --chip ${{ matrix.target }} merge_bin --fill-flash-size 4MB -o flash.bin @flash_args
      - name: Test
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          python tools/qemu_test.py firmware/build/${{ matrix.board }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-${{ matrix.target }}-screenshot
          path: firmware/build/${{ matrix.board }}/qemu_page0.png
